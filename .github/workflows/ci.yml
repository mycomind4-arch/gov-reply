name: Verify application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Cloudflare dry-run build
        run: npm run build
      - name: Check shared UI modules
        run: |
          node --check public/app.js
          node --check public/components.js
          node --check public/pages.js
